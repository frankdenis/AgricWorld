<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgricWorld — Everything Agriculture. One Powerful Marketplace.</title>
<meta name="description" content="AgricWorld is Nigeria's premium digital agricultural ecosystem: buy and sell poultry, livestock, fish, crops, seeds, agrochemicals, machinery, feed, produce, logistics and agri-services from verified farmers and companies.">
<meta name="theme-color" content="#0f5132">
<meta property="og:title" content="AgricWorld — Everything Agriculture. One Powerful Marketplace.">
<meta property="og:description" content="22 agricultural sectors. Verified sellers. Escrow-protected payments. Nationwide delivery.">
<meta property="og:image" content="assets/img/hero-main.jpg">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f5132'/%3E%3Cpath d='M18 46c0-16 10-26 28-28-2 18-12 28-28 28z' fill='%2334d399'/%3E%3Cpath d='M20 44l20-20' stroke='%230f5132' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/img/hero-main.jpg">
<link rel="preload" href="assets/fonts/jakarta.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/img/hero-main.jpg" as="image">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- Leaf loading animation (no spinner) -->
<div class="loader" id="loader" aria-hidden="true">
  <div class="loader-inner">
    <div class="loader-leaf">
      <svg viewBox="0 0 64 64" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path class="leaf-fill" d="M14 50c0-18 12-30 34-32-2 22-14 34-34 32z" fill="#34d399" stroke="none"/>
        <path d="M14 50c0-18 12-30 34-32-2 22-14 34-34 32z"/>
        <path d="M16 48l24-24"/>
      </svg>
    </div>
    <div class="loader-brand">AGRIC<em>WORLD</em></div>
    <div class="loader-bar"><span></span></div>
  </div>
</div>

<canvas id="particles" aria-hidden="true"></canvas>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
    <a href="#/" class="brand" aria-label="AgricWorld home">
      <span class="brand-mark"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span></span>
      <span class="brand-txt"><span class="brand-name">AGRIC<em>WORLD</em></span><span class="brand-sub">Digital Agri Ecosystem</span></span>
    </a>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <div class="hdr-search">
      <span class="i lead" id="hdrSearchIcon"></span>
      <input class="field" id="hdrSearch" type="search" placeholder="Search products, sellers, sectors…" autocomplete="off" aria-label="Search">
      <span class="kbd">/</span>
      <div class="suggest" id="hdrSuggest"></div>
    </div>
    <div class="hdr-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
      <button class="icon-btn" id="cartBtn" aria-label="Cart"></button>
      <a class="avatar-btn" id="userBtn" role="button" tabindex="0"></a>
    </div>
  </div>
</header>

<div class="drawer-ov" id="drawerOv"></div>
<aside class="drawer" id="drawer" aria-label="Menu"></aside>

<main id="main"></main>

<footer id="footer"></footer>

<nav class="bnav" id="bnav" aria-label="Mobile navigation"></nav>

<div class="cart-ov" id="cartOv"></div>
<aside class="cart-pnl" id="cartPnl" aria-label="Shopping cart"></aside>

<div class="modal-ov" id="authOv"></div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<button class="btt" id="btt" aria-label="Back to top"></button>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/dashboards.js"></script>
</body>
</html>
